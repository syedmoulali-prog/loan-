services:
  # Spring Boot Backend Web Service
  - type: web
    name: loan-eligibility-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_URL
        fromDatabase:
          name: loan-eligibility-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: loan-eligibility-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: loan-eligibility-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  # Managed MySQL Database
  - name: loan-eligibility-db
    databaseName: customer_loan_system
    user: loan_admin
    plan: free
    region: oregon
